<style>
:root{--bg:#f7f2ec;--card:#fff;--ink:#2a1a1f;--muted:#8b7b80;--wine:#6d1530;--wine2:#8e1b3a;--line:#ebe1da;--ok:#3f7d4e;--bad:#b3261e;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
select,input,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(160deg,#5e1029,#8e1b3a);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.top h1{margin:0;font:600 27px/1.2 Georgia,"Times New Roman",serif}
.top .sum{opacity:.85;font-size:14px;margin-top:4px}
.cbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.15)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.wrap{padding:14px 14px 90px;max-width:760px;margin:0 auto}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.row2{display:flex;gap:8px;margin-top:6px}
.sel{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b7b80 50%),linear-gradient(135deg,#8b7b80 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px;color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:10px 2px 0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-top:8px;box-shadow:0 1px 2px rgba(60,20,30,.06);cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.main{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{font-size:13px;color:var(--wine2);margin-top:2px}
.qty{min-width:38px;height:38px;border-radius:50%;background:#f3e9e4;display:grid;place-items:center;font-weight:700;color:var(--wine);flex:none}
.qty.zero{background:#eee;color:#aaa}
.empty{text-align:center;color:var(--muted);padding:36px 20px}
.tabs{position:relative;flex:none;display:flex;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;min-height:52px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--wine)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--wine);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(109,21,48,.35);z-index:11}
.fab.hide{display:none}
#backdrop{position:fixed;inset:0;background:rgba(20,8,12,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;z-index:21;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
#sheet.noact{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#ebe1da;color:#5a4a4f;font-size:16px;line-height:34px;text-align:center;padding:0;z-index:2}
.actions{position:sticky;bottom:-16px;margin:14px -16px -16px;padding:6px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(247,242,236,0),var(--bg) 14px);z-index:3}
.actions .btn{margin-top:8px}
#sheet.on{transform:none}
@media(min-width:700px){#sheet{max-width:640px;margin:0 auto}}
.grab{width:40px;height:5px;border-radius:3px;background:#d8cbc4;margin:2px auto 10px}
h2{font:600 22px/1.25 Georgia,serif;margin:4px 44px 2px 0}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 2px 6px;font-weight:600}
.card{background:#fff;border-radius:var(--r);padding:12px 14px;margin-top:10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:14px;display:flex;align-items:center;gap:6px}
.seg button.on{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine);font-weight:600}
.seg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;width:max-content}
.stepper button{width:44px;height:42px;border:0;background:none;font-size:22px;color:var(--wine)}
.stepper input{width:52px;text-align:center;border:0;font-size:17px;font-weight:600;background:none}
.item:active{background:#fbf6f2}.btn:active,.chip:active,.ic:active{opacity:.75}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:16px;font-weight:600;margin-top:10px;background:#fff;border:1px solid var(--line);text-align:center}
.btn.p{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}.kv>span:first-child{color:var(--muted);flex:none}.kv>span:last-child{text-align:right}
.stars{color:#c99a2e;letter-spacing:2px}
.starpick{display:flex;flex-wrap:nowrap;gap:2px;height:44px;align-items:center}.starpick button{border:0;background:none;font-size:27px;color:#d8cbc4;padding:0 2px;line-height:1}.starpick button.on{color:#c99a2e}
.cgrid{display:grid;gap:4px;margin-top:8px}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px dashed #d6c7c0;background:#fbf8f5;display:grid;place-items:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.95);overflow:hidden;padding:0;line-height:1;min-width:0}
.cell.occ{border:0;box-shadow:inset 0 -2px 4px rgba(0,0,0,.25)}
.cell.light{color:rgba(60,30,10,.8)}
.cell.sel{border:0;outline:3px solid var(--wine);outline-offset:1px}
.cell.dis{opacity:.3}
.cell.hl{outline:3px solid #1d1013;outline-offset:1px}
.cell.dim{opacity:.35}
.lab{font-size:10px;color:var(--muted);display:grid;place-items:center}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph b{font-size:17px}.ph small{color:var(--muted);font-size:13px}
.ic{border:0;background:#f3e9e4;color:var(--wine);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:#fff;border-radius:12px;padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:21px;color:var(--wine)}.kpi span{font-size:12px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}
.bar .n{width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b{flex:1;height:10px;background:#f1e8e3;border-radius:5px;overflow:hidden}
.bar .b i{display:block;height:100%;border-radius:5px}
.bar .v{width:34px;text-align:right;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(144px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a1a1f;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;display:flex;gap:14px;align-items:center;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:#f4a3b4;font-weight:700;font-size:14px;padding:0}
.status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-ok{background:#e3f1e6;color:var(--ok)}.st-wait{background:#eef0f6;color:#4a5a8a}.st-late{background:#fbe7e5;color:var(--bad)}
.hist{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.hist:last-child{border:0}
.hist small{color:var(--muted);margin-left:auto;flex:none}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.cab{display:block;width:100%;height:auto;margin:10px auto 0}
.cab .b,.cab .e{cursor:pointer}
.cab .dim{opacity:.28}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
.cab .ring{animation:pulse 1.1s ease-in-out infinite}
.overview{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.overview::-webkit-scrollbar{display:none}
.ov{flex:none;width:112px;background:#fff;border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;border:0;box-shadow:0 1px 2px rgba(60,20,30,.06)}
.ov svg{display:block;height:78px;width:auto;max-width:100% !important;margin:0 auto}
.ov b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.ov span{color:var(--muted)}
.boxwrap{display:flex;gap:12px;align-items:center;margin-top:6px}
.boxwrap svg{width:92px;flex:none}
.mini{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- Référentiels ---------- */
const COUL = {
  rouge:{l:'Rouge',c:'#8e1b3a'},
  blanc:{l:'Blanc',c:'#e8d06a',light:1},
  rose:{l:'Rosé',c:'#f2a0b3',light:1},
  effervescent:{l:'Effervescent',c:'#cddc8f',light:1},
  liquoreux:{l:'Liquoreux',c:'#d4932a'},
  orange:{l:'Orange',c:'#e07b39'}
};
const REG = {
  'Alsace':['Alsace','Alsace Grand Cru','Crémant d\'Alsace'],
  'Beaujolais':['Beaujolais','Beaujolais-Villages','Brouilly','Chénas','Chiroubles','Côte de Brouilly','Fleurie','Juliénas','Morgon','Moulin-à-Vent','Régnié','Saint-Amour'],
  'Bordeaux':['Bordeaux','Bordeaux Supérieur','Médoc','Haut-Médoc','Margaux','Pauillac','Saint-Julien','Saint-Estèphe','Listrac-Médoc','Moulis','Pessac-Léognan','Graves','Saint-Émilion','Saint-Émilion Grand Cru','Pomerol','Lalande-de-Pomerol','Fronsac','Côtes de Bourg','Blaye Côtes de Bordeaux','Castillon Côtes de Bordeaux','Entre-Deux-Mers','Sauternes','Barsac','Crémant de Bordeaux'],
  'Bourgogne':['Bourgogne','Bourgogne Aligoté','Bourgogne Hautes-Côtes de Beaune','Bourgogne Hautes-Côtes de Nuits','Chablis','Chablis Premier Cru','Chablis Grand Cru','Petit Chablis','Irancy','Marsannay','Fixin','Gevrey-Chambertin','Morey-Saint-Denis','Chambolle-Musigny','Vougeot','Clos de Vougeot','Vosne-Romanée','Nuits-Saint-Georges','Côte de Nuits-Villages','Ladoix','Aloxe-Corton','Corton','Corton-Charlemagne','Pernand-Vergelesses','Savigny-lès-Beaune','Chorey-lès-Beaune','Beaune','Pommard','Volnay','Monthélie','Auxey-Duresses','Saint-Romain','Meursault','Puligny-Montrachet','Chassagne-Montrachet','Saint-Aubin','Santenay','Maranges','Côte de Beaune-Villages','Bouzeron','Rully','Mercurey','Givry','Montagny','Mâcon','Mâcon-Villages','Viré-Clessé','Saint-Véran','Pouilly-Fuissé','Pouilly-Vinzelles','Pouilly-Loché','Crémant de Bourgogne'],
  'Champagne':['Champagne','Coteaux Champenois','Rosé des Riceys'],
  'Corse':['Vin de Corse','Ajaccio','Patrimonio','Muscat du Cap Corse','IGP Île de Beauté'],
  'Jura':['Arbois','Côtes du Jura','Château-Chalon','L\'Étoile','Crémant du Jura','Macvin du Jura'],
  'Languedoc-Roussillon':['Languedoc','Pic Saint-Loup','Saint-Chinian','Faugères','Minervois','Minervois-La Livinière','Corbières','Corbières-Boutenac','Fitou','Terrasses du Larzac','Grès de Montpellier','Saint-Drézéry','Saint-Georges-d\'Orques','Pézenas','La Clape','Picpoul de Pinet','Cabardès','Malepère','Limoux','Blanquette de Limoux','Crémant de Limoux','Muscat de Frontignan','Muscat de Lunel','Côtes du Roussillon','Côtes du Roussillon Villages','Collioure','Banyuls','Maury','Rivesaltes','IGP Pays d\'Oc','IGP Côtes Catalanes','Vin de France'],
  'Loire':['Muscadet','Muscadet Sèvre et Maine','Anjou','Anjou-Villages','Savennières','Coteaux du Layon','Quarts de Chaume','Bonnezeaux','Saumur','Saumur-Champigny','Chinon','Bourgueil','Saint-Nicolas-de-Bourgueil','Vouvray','Montlouis-sur-Loire','Touraine','Cheverny','Sancerre','Pouilly-Fumé','Menetou-Salon','Quincy','Reuilly','Crémant de Loire'],
  'Provence':['Côtes de Provence','Bandol','Cassis','Bellet','Palette','Coteaux d\'Aix-en-Provence','Les Baux-de-Provence','Coteaux Varois en Provence'],
  'Savoie / Bugey':['Vin de Savoie','Roussette de Savoie','Apremont','Chignin','Chignin-Bergeron','Bugey','Crémant de Savoie'],
  'Sud-Ouest':['Cahors','Madiran','Pacherenc du Vic-Bilh','Jurançon','Irouléguy','Gaillac','Fronton','Marcillac','Buzet','Côtes de Duras','Bergerac','Pécharmant','Monbazillac','Saussignac','IGP Côtes de Gascogne'],
  'Vallée du Rhône':['Côtes du Rhône','Côtes du Rhône Villages','Côte-Rôtie','Condrieu','Château-Grillet','Saint-Joseph','Crozes-Hermitage','Hermitage','Cornas','Saint-Péray','Châteauneuf-du-Pape','Gigondas','Vacqueyras','Rasteau','Cairanne','Vinsobres','Beaumes-de-Venise','Muscat de Beaumes-de-Venise','Lirac','Tavel','Ventoux','Luberon','Costières de Nîmes','Grignan-les-Adhémar','Duché d\'Uzès','Clairette de Die','IGP Collines Rhodaniennes'],
  'Étranger':['Italie','Espagne','Portugal','Allemagne','Suisse','Autriche','Grèce','Hongrie','Liban','États-Unis','Argentine','Chili','Afrique du Sud','Australie','Nouvelle-Zélande'],
  'Autre':[]
};
const STYLES = {
  bois:{l:'Casier en bois',i:'🪵'},
  frigo:{l:'Cave électrique',i:'🧊'},
  etagere:{l:'Étagère murale',i:'📚'},
  libre:{l:'Zone libre (carton, placard…)',i:'📦'}
};
const APP2REG = {};
for (const [r,l] of Object.entries(REG)) l.forEach(a => APP2REG[norm(a)] = r);
const YEAR = new Date().getFullYear();
const KEY = 'caveavin.v1';

/* ---------- État ---------- */
let S = load();
let view = 'cave';
const F = {q:'', couleur:'', region:'', tri:'domaine', epuises:false};
let FS = null;   // état du formulaire vin
let CS = null;   // état du formulaire casier
let undoSnap = null;

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.vins)) return migrate(Object.assign({version:1,casiers:[],vins:[],historique:[]}, s)); } catch(e){}
  return {version:1,casiers:[],vins:[],historique:[]};
}
function migrate(s){
  s.casiers.forEach(c => { if (!c.style) c.style = c.rangees ? 'bois' : 'libre'; if (!c.sens) c.sens = 'haut'; if (!c.lignes) c.lignes = 1; });
  s.vins.forEach(v => {
    const c = s.casiers.find(x => x.id === v.casierId);
    if (c && c.rangees && c.lignes > 1 && v.cases) v.cases = v.cases.filter(k => { const [i, col] = k.split(',').map(Number); return !((i % c.lignes) % 2 === 1 && col === c.colonnes - 1); });
  });
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Erreur de sauvegarde'); } }
function snap(){ undoSnap = JSON.stringify(S); }

/* ---------- Utilitaires ---------- */
function norm(s){ return String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sum = a => a.reduce((x,y) => x + (+y||0), 0);
const getV = id => S.vins.find(v => v.id === id);
const getC = id => S.casiers.find(c => c.id === id);
const colOf = v => (COUL[v.couleur] || COUL.rouge).c;
const styleOf = c => !c || !c.rangees ? 'libre' : (STYLES[c.style] && c.style !== 'libre' ? c.style : 'bois');
const nbL = c => Math.max(1, c.lignes || 1);
const nbE = c => Math.round(c.rangees / nbL(c));
// En quinconce : les lignes impaires (2e, 4e en partant du bas) sont décalées d'une demi-bouteille et ont une place de moins
const isStag = (c, i) => (i % nbL(c)) % 2 === 1;
const validCell = (c, k) => { const [i, col] = k.split(',').map(Number); return i < c.rangees && col < c.colonnes && !(isStag(c, i) && col === c.colonnes - 1); };
const capacity = c => c.rangees ? nbE(c) * (nbL(c) * c.colonnes - Math.floor(nbL(c) / 2)) : 0;
const etageNum = (c, i) => { const e = Math.floor(i / nbL(c)); return c.sens === 'bas' ? nbE(c) - e : e + 1; };
const LIGNES = {2:['bas','haut'], 3:['bas','milieu','haut']};
const ligneName = (c, i) => { const L = nbL(c); if (L === 1) return ''; const lb = i % L; return LIGNES[L] ? LIGNES[L][lb] : 'L' + (lb + 1); };
const cellLabel = (k, c) => { const [r,col] = k.split(',').map(Number); if (!c || !c.rangees) return String.fromCharCode(65+r) + (col+1); const ln = ligneName(c, r); return `Ét.${etageNum(c,r)}${ln ? ' ' + ln : ''} n°${col+1}`; };
function slotsText(c, cases){
  const m = new Map();
  const L = nbL(c);
  cases.map(k => k.split(',').map(Number)).sort((a,b) => etageNum(c,a[0]) - etageNum(c,b[0]) || (a[0] % L) - (b[0] % L) || a[1] - b[1])
    .forEach(([r,col]) => { const ln = ligneName(c, r), key = `Ét.${etageNum(c,r)}${ln ? ' ' + ln : ''}`; if (!m.has(key)) m.set(key, []); m.get(key).push(col + 1); });
  return [...m].map(([e,l]) => `${e} n°${l.join(', ')}`).join(' · ');
}
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);
const euro = n => (+n).toLocaleString('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits: (+n % 1 ? 2 : 0)});
const cmp = (a,b) => String(a||'').localeCompare(String(b||''), 'fr', {sensitivity:'base'});

function garde(v){
  if (!v.boireDe && !v.boireJusqua) return null;
  if (v.boireJusqua && YEAR > v.boireJusqua) return ['late', 'À boire vite'];
  if (v.boireDe && YEAR < v.boireDe) return ['wait', 'À garder'];
  return ['ok', 'Prêt à boire'];
}
function locText(v){
  const c = getC(v.casierId);
  const parts = [];
  if (c) parts.push(c.nom);
  if (c && v.cases && v.cases.length) parts.push(slotsText(c, v.cases));
  if (v.emplacement) parts.push(v.emplacement);
  let s = parts.join(' · ');
  if (c && c.rangees && v.qte > (v.cases||[]).length && v.cases && v.cases.length) s += ` (+${v.qte - v.cases.length} non placée${v.qte - v.cases.length > 1 ? 's' : ''})`;
  return s;
}
function occupancy(cid, exceptId){
  const m = new Map();
  S.vins.forEach(v => { if (v.casierId === cid && v.id !== exceptId) (v.cases||[]).forEach(k => m.set(k, v)); });
  return m;
}
function abbr(v){
  if (/\d{4}/.test(v.millesime)) return "'" + String(v.millesime).match(/\d{4}/)[0].slice(-2);
  return (v.domaine||'?').replace(/^(domaine|château|chateau|clos|maison)\s+(de\s+|du\s+|des\s+|d')?/i,'').slice(0,2).toUpperCase();
}

/* ---------- Rendu ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#fab').classList.toggle('hide', !(view === 'cave' || view === 'plan'));
  const app = $('#app');
  if (view === 'cave') { app.innerHTML = vCave(); renderList(); }
  else if (view === 'plan') app.innerHTML = vPlan();
  else if (view === 'stats') app.innerHTML = vStats();
  else app.innerHTML = vReglages();
}

function header(title){
  const tot = sum(S.vins.map(v => v.qte));
  const refs = S.vins.filter(v => v.qte > 0).length;
  const byC = {}; S.vins.forEach(v => byC[v.couleur] = (byC[v.couleur]||0) + (+v.qte||0));
  const keys = Object.keys(COUL).filter(k => byC[k]);
  return `<header class="top"><h1>${title}</h1>
    <div class="sum">${plural(tot,'bouteille')} · ${plural(refs,'référence')}</div>
    ${tot ? `<div class="cbar">${keys.map(k => `<span style="width:${byC[k]/tot*100}%;background:${COUL[k].c}"></span>`).join('')}</div>
    <div class="legend">${keys.map(k => `<span><i style="background:${COUL[k].c}"></i>${COUL[k].l} ${byC[k]}</span>`).join('')}</div>` : ''}
  </header>`;
}

function vCave(){
  const regions = [...new Set(S.vins.map(v => v.region).filter(Boolean))].sort(cmp);
  return header('Ma cave') + `<div class="wrap">
    <input id="q" class="search" type="search" placeholder="🔍 Domaine, appellation, année…" value="${esc(F.q)}" autocomplete="off">
    <div class="chips">
      <button class="chip${!F.couleur?' on':''}" data-act="fcol" data-v="">Toutes</button>
      ${Object.entries(COUL).map(([k,c]) => `<button class="chip${F.couleur===k?' on':''}" data-act="fcol" data-v="${k}"><i style="background:${c.c}"></i>${c.l}</button>`).join('')}
    </div>
    <div class="row2">
      <select id="fr" class="sel"><option value="">Toutes régions</option>${regions.map(r => `<option${F.region===r?' selected':''}>${esc(r)}</option>`).join('')}</select>
      <select id="ft" class="sel">
        ${[['domaine','↕ Domaine'],['region','↕ Région'],['millesime','↕ Millésime'],['garde','↕ À boire d\'abord'],['qte','↕ Quantité'],['recent','↕ Derniers ajouts']].map(([v,l]) => `<option value="${v}"${F.tri===v?' selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div id="list"></div>
  </div>`;
}

function filtered(){
  const q = norm(F.q);
  const l = S.vins.filter(v => (F.epuises || v.qte > 0) && (!F.couleur || v.couleur === F.couleur) && (!F.region || v.region === F.region)
    && (!q || norm([v.domaine,v.cuvee,v.appellation,v.region,v.millesime,v.commentaire,locText(v),(COUL[v.couleur]||{}).l].join(' ')).includes(q)));
  l.sort((a,b) => {
    switch (F.tri) {
      case 'millesime': return (parseInt(a.millesime)||9999) - (parseInt(b.millesime)||9999) || cmp(a.domaine,b.domaine);
      case 'region': return cmp(a.region||'~',b.region||'~') || cmp(a.appellation,b.appellation) || cmp(a.domaine,b.domaine);
      case 'recent': return (b.ajout||0) - (a.ajout||0);
      case 'garde': return (+a.boireJusqua||9999) - (+b.boireJusqua||9999) || cmp(a.domaine,b.domaine);
      case 'qte': return b.qte - a.qte || cmp(a.domaine,b.domaine);
      default: return cmp(a.domaine,b.domaine) || (parseInt(a.millesime)||0) - (parseInt(b.millesime)||0);
    }
  });
  return l;
}

function itemHTML(v){
  const g = garde(v), loc = locText(v);
  const sub = [v.cuvee, v.appellation || v.region, v.millesime].filter(Boolean).join(' · ');
  return `<div class="item" data-act="open" data-id="${v.id}">
    <span class="dot" style="background:${colOf(v)}"></span>
    <div class="main"><div class="t">${esc(v.domaine)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}
      ${loc ? `<div class="loc">📍 ${esc(loc)}</div>` : ''}
      ${g && g[0]==='late' && v.qte ? `<div class="loc" style="color:var(--bad)">⏳ À boire vite (garde jusqu'en ${v.boireJusqua})</div>` : ''}
    </div>
    <div class="qty${v.qte?'':' zero'}">${v.qte}</div></div>`;
}

function renderList(){
  const el = $('#list'); if (!el) return;
  if (!S.vins.length) {
    el.innerHTML = `<div class="empty"><div style="font-size:42px">🍷</div><p>Ta cave est vide.<br>Commence par créer tes casiers dans <b>Plan</b>, puis ajoute tes bouteilles avec le bouton <b>+</b>.</p>
      <button class="btn p" data-act="new">Ajouter une première bouteille</button></div>`;
    return;
  }
  const l = filtered();
  const nb = sum(l.map(v => v.qte));
  let h = `<div class="count">${plural(l.length,'référence')} · ${plural(nb,'bouteille')}
    <span style="float:right"><label><input type="checkbox" id="fep"${F.epuises?' checked':''}> épuisés</label></span></div>`;
  if (!l.length) h += `<div class="empty">Aucun vin ne correspond.</div>`;
  let last = null;
  l.forEach(v => {
    if (F.tri === 'region' && (v.region||'Sans région') !== last) { last = v.region||'Sans région'; h += `<h3>${esc(last)}</h3>`; }
    h += itemHTML(v);
  });
  el.innerHTML = h;
}

/* ---------- Dessins ---------- */
const f1 = n => Math.round(n * 10) / 10;
function bottleSVG(x, y, r, couleur, txt){
  const cc = COUL[couleur] || COUL.rouge;
  const hx = f1(x - r*.38), hy = f1(y - r*.42);
  return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${cc.c}"/>`
    + `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r*.8)}" fill="none" stroke="rgba(0,0,0,.26)" stroke-width="${f1(r*.14)}"/>`
    + `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r*.36)}" fill="rgba(0,0,0,.18)"/>`
    + `<ellipse cx="${hx}" cy="${hy}" rx="${f1(r*.34)}" ry="${f1(r*.17)}" fill="rgba(255,255,255,.45)" transform="rotate(-35 ${hx} ${hy})"/>`
    + (txt && r > 7 ? `<text x="${f1(x)}" y="${f1(y + r*.22)}" text-anchor="middle" font-size="${f1(r*.62)}" font-weight="700" font-family="-apple-system,Segoe UI,sans-serif" fill="${cc.light ? 'rgba(50,25,5,.85)' : 'rgba(255,255,255,.95)'}">${esc(txt)}</text>` : '');
}
function emptySVG(x, y, r, dark){
  return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${dark ? 'rgba(255,255,255,.05)' : '#f6efe8'}" stroke="${dark ? 'rgba(255,255,255,.24)' : '#d6c7c0'}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
}
const DEFS = `<defs>
  <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b07a45"/><stop offset=".5" stop-color="#94612f"/><stop offset="1" stop-color="#7a4c24"/></linearGradient>
  <linearGradient id="gPlank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6a46c"/><stop offset="1" stop-color="#94643a"/></linearGradient>
  <linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e1c10"/><stop offset="1" stop-color="#1b100a"/></linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25323f"/><stop offset=".25" stop-color="#131921"/><stop offset="1" stop-color="#0a0d11"/></linearGradient>
  <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d09a5e"/><stop offset="1" stop-color="#b27c42"/></linearGradient>
</defs>`;

/* Dessine un meuble à bouteilles. o.mode='form' (sélection), o.mini (vignette), o.hl/o.hlk (mise en évidence) */
function drawCasier(c, o = {}){
  const st = styleOf(c), C = c.colonnes, mini = !!o.mini, L = nbL(c), E = nbE(c);
  const fr = st === 'etagere' ? 0 : (st === 'frigo' ? 14 : 10);
  const pad = st === 'etagere' ? 4 : 6;
  const LM = mini ? 4 : 40, TM = mini ? 4 : 16;
  const s = Math.min(46, (360 - 2*LM - 2*fr - 2*pad) / C);
  const plank = st === 'frigo' ? 5 : (st === 'etagere' ? 7 : 6);
  const lineH = s * .87;                       // quinconce : la ligne du dessus se loge dans les creux
  const rowH = s + (L - 1) * lineH + plank + 3;   // hauteur d'un étage
  const headIn = st === 'frigo' ? 12 : 0, footIn = st === 'frigo' ? 26 : 0;
  const cabW = C*s + 2*pad + 2*fr, cabH = 2*fr + headIn + E*rowH + footIn;
  const W = cabW + 2*LM, H = TM + cabH + (st === 'etagere' ? 4 : 8);
  const cx = LM, cy = TM, ix = cx + fr, iy = cy + fr, iw = cabW - 2*fr, ih = cabH - 2*fr;
  const dark = st !== 'etagere';
  const occ = occupancy(c.id, o.mode === 'form' ? o.exceptId : null);
  let g = DEFS;
  if (st === 'bois') {
    g += `<rect x="${cx+6}" y="${cy+cabH-2}" width="12" height="8" fill="#5e3a1c"/><rect x="${cx+cabW-18}" y="${cy+cabH-2}" width="12" height="8" fill="#5e3a1c"/>`;
    g += `<rect x="${cx}" y="${cy}" width="${f1(cabW)}" height="${f1(cabH)}" rx="5" fill="url(#gWood)"/>`;
    g += `<rect x="${ix}" y="${iy}" width="${f1(iw)}" height="${f1(ih)}" rx="2" fill="url(#gIn)"/>`;
    if (L === 1) for (let j = 1; j < C; j++) g += `<line x1="${f1(ix+pad+j*s)}" y1="${iy}" x2="${f1(ix+pad+j*s)}" y2="${f1(iy+ih)}" stroke="rgba(255,255,255,.04)" stroke-width="1"/>`;
  } else if (st === 'frigo') {
    g += `<rect x="${cx+10}" y="${cy+cabH-2}" width="14" height="8" rx="2" fill="#18191c"/><rect x="${cx+cabW-24}" y="${cy+cabH-2}" width="14" height="8" rx="2" fill="#18191c"/>`;
    g += `<rect x="${cx}" y="${cy}" width="${f1(cabW)}" height="${f1(cabH)}" rx="12" fill="#2b2d31"/>`;
    g += `<rect x="${ix}" y="${iy}" width="${f1(iw)}" height="${f1(ih)}" rx="6" fill="url(#gGlass)"/>`;
    g += `<rect x="${f1(ix+iw*.2)}" y="${iy+4}" width="${f1(iw*.6)}" height="3" rx="1.5" fill="#bfe3ff" opacity=".75"/>`;
    const fy = iy + ih - footIn;
    g += `<rect x="${ix}" y="${f1(fy)}" width="${f1(iw)}" height="${footIn}" rx="0" fill="#1c1e22"/>`;
    for (let x = ix + 8; x < ix + iw*.55; x += 6) g += `<line x1="${f1(x)}" y1="${f1(fy+7)}" x2="${f1(x)}" y2="${f1(fy+footIn-7)}" stroke="#34373d" stroke-width="2"/>`;
    if (!mini) g += `<text x="${f1(ix+iw-10)}" y="${f1(fy+17)}" text-anchor="end" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#7fe0a0">12°C</text>`;
    g += `<rect x="${f1(cx+cabW-fr/2-2)}" y="${f1(cy+cabH*.3)}" width="4" height="${f1(cabH*.35)}" rx="2" fill="#c9ccd1"/>`;
  }
  for (let e = 0; e < E; e++) {
    const ry = iy + headIn + e*rowH, py = ry + s + (L - 1)*lineH + 3, i0 = e * L;
    if (st === 'etagere') {
      g += `<path d="M${cx+14} ${f1(py+plank)} v10 l10 -10z M${f1(cx+cabW-14)} ${f1(py+plank)} v10 l-10 -10z" fill="#7a4c24"/>`;
      g += `<rect x="${cx}" y="${f1(py)}" width="${f1(cabW)}" height="${plank}" rx="1.5" fill="url(#gPlank)"/>`;
    } else {
      g += `<rect x="${ix}" y="${f1(py)}" width="${f1(iw)}" height="${plank}" fill="url(#gPlank)"/>`;
      if (st === 'frigo') g += `<rect x="${ix}" y="${f1(py)}" width="${f1(iw)}" height="1" fill="rgba(255,255,255,.35)"/>`;
    }
    if (!mini) {
      const my = ry + 2 + (s + (L - 1)*lineH) / 2;
      g += `<text x="${cx-6}" y="${f1(my + (L > 1 ? 0 : 4))}" text-anchor="end" font-size="11" font-family="-apple-system,Segoe UI,sans-serif" fill="#8b7b80">Ét.${etageNum(c,i0)}</text>`;
      if (L > 1) g += `<text x="${cx-6}" y="${f1(my + 12)}" text-anchor="end" font-size="8.5" font-family="-apple-system,Segoe UI,sans-serif" fill="#a8999d">${L} lignes</text>`;
    }
    for (let lt = 0; lt < L; lt++) {             // de la ligne du haut vers celle du bas
    const i = i0 + (L - 1 - lt), by = ry + 2 + lt*lineH + s/2, stag = isStag(c, i);
    for (let j = 0; j < C; j++) {
      if (stag && j === C - 1) continue;
      const bx = ix + pad + j*s + s/2 + (stag ? s/2 : 0), r = s*.42, k = i + ',' + j, v = occ.get(k);
      const hit = `<rect x="${f1(bx-s/2)}" y="${f1(by-s/2)}" width="${f1(s)}" height="${f1(s)}" fill="transparent"/>`;
      const ring = `<circle class="ring" cx="${f1(bx)}" cy="${f1(by)}" r="${f1(r+3)}" fill="none" stroke="${dark ? '#fff' : '#2a1a1f'}" stroke-width="3"/>`;
      if (mini) g += v ? bottleSVG(bx, by, r, v.couleur) : emptySVG(bx, by, r, dark);
      else if (o.mode === 'form') {
        if (v) g += `<g class="dim">${bottleSVG(bx, by, r, v.couleur)}</g>`;
        else if (o.sel.has(k)) g += `<g class="e" data-act="fcell" data-k="${k}">${hit}${bottleSVG(bx, by, r, FS.couleur)}<circle cx="${f1(bx)}" cy="${f1(by)}" r="${f1(r+3)}" fill="none" stroke="${dark ? '#fff' : '#2a1a1f'}" stroke-width="2.5"/></g>`;
        else g += `<g class="e" data-act="fcell" data-k="${k}">${hit}${emptySVG(bx, by, r, dark)}</g>`;
      } else if (v) {
        const dim = o.hl && v.id !== o.hl, hl = o.hl && v.id === o.hl && (!o.hlk || o.hlk === k);
        g += `<g class="b${dim ? ' dim' : ''}" data-act="cellocc" data-id="${v.id}" data-k="${k}">${hit}${bottleSVG(bx, by, r, v.couleur, abbr(v))}${hl ? ring : ''}</g>`;
      } else {
        g += `<g class="e${o.hl ? ' dim' : ''}" data-act="cellempty" data-k="${k}" data-c="${c.id}">${hit}${emptySVG(bx, by, r, dark)}</g>`;
      }
    }
    }
  }
  if (!mini) {
    const step = C > 16 ? 2 : 1;
    for (let j = 0; j < C; j += step) g += `<text x="${f1(ix+pad+j*s+s/2)}" y="${TM-5}" text-anchor="middle" font-size="9" font-family="-apple-system,Segoe UI,sans-serif" fill="#a8999d">${j+1}</text>`;
  }
  return `<svg class="cab" viewBox="0 0 ${f1(W)} ${f1(H)}" style="max-width:${Math.round(W*1.3)}px" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* Carton ouvert pour les zones libres, avec un goulot par bouteille (max 7) */
function drawBox(vins){
  const necks = [];
  vins.forEach(v => { for (let i = 0; i < v.qte && necks.length < 7; i++) necks.push(colOf(v)); });
  let g = DEFS + `<path d="M14 40 L4 26 L30 24 L34 38z" fill="#a8743c"/><path d="M86 40 L96 26 L70 24 L66 38z" fill="#a8743c"/>`;
  g += `<rect x="14" y="34" width="72" height="8" fill="#5a3a1e"/>`;
  necks.forEach((col, i) => { const x = 22 + i * 9.5; g += `<rect x="${f1(x)}" y="8" width="6" height="34" rx="2" fill="#24331f"/><rect x="${f1(x-.5)}" y="6" width="7" height="8" rx="1.5" fill="${col}"/>`; });
  g += `<rect x="14" y="40" width="72" height="44" rx="2" fill="url(#gBox)"/><rect x="44" y="40" width="12" height="44" fill="rgba(255,255,255,.18)"/>`;
  g += `<rect x="14" y="40" width="72" height="4" fill="rgba(0,0,0,.12)"/>`;
  const n = sum(vins.map(v => v.qte));
  g += `<text x="50" y="70" text-anchor="middle" font-size="13" font-weight="700" font-family="-apple-system,Segoe UI,sans-serif" fill="#5a3a1e">${n}</text>`;
  return `<svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

function vPlan(){
  let h = header('Plan de la cave') + '<div class="wrap">';
  if (!S.casiers.length) {
    h += `<div class="empty"><div style="font-size:42px">🗄️</div><p>Décris ta cave : crée un casier par meuble ou étagère (nombre de rangées × colonnes), ou une zone libre pour un carton, un placard…</p>
      <button class="btn p" data-act="newcas">Créer mon premier casier</button></div>`;
  }
  const info = c => c.rangees ? `${occupancy(c.id).size}/${capacity(c)}` : plural(sum(S.vins.filter(v => v.casierId === c.id).map(v => v.qte)), 'bt', 'bts');
  if (S.casiers.length > 1) {
    h += `<div class="overview">${S.casiers.map(c => `<button class="ov" data-act="goto" data-id="${c.id}">${c.rangees ? drawCasier(c, {mini:1}) : drawBox(S.vins.filter(v => v.casierId === c.id && v.qte > 0))}<b>${esc(c.nom)}</b><span>${info(c)}</span></button>`).join('')}</div>`;
  }
  S.casiers.forEach(c => {
    const inC = S.vins.filter(v => v.casierId === c.id && v.qte > 0);
    if (c.rangees) {

      h += `<div class="card" id="cas-${c.id}"><div class="ph"><div><b>${esc(c.nom)}</b><br><small>${STYLES[styleOf(c)].l} · ${occ}/${cap} places occupées</small></div><button class="ic" data-act="editcas" data-id="${c.id}">Modifier</button></div>${drawCasier(c)}</div>`;
    } else {
      h += `<div class="card" id="cas-${c.id}"><div class="ph"><div><b>${esc(c.nom)}</b><br><small>Zone libre · ${plural(sum(inC.map(v=>v.qte)),'bouteille')}</small></div><button class="ic" data-act="editcas" data-id="${c.id}">Modifier</button></div>
        <div class="boxwrap">${drawBox(inC)}<div class="mini">${inC.length ? 'Touche un vin ci-dessous pour le voir ou le boire.' : 'Vide pour l\'instant. Choisis cette zone comme « Rangement » quand tu ajoutes un vin.'}</div></div>
        ${inC.sort((a,b)=>cmp(a.domaine,b.domaine)).map(itemHTML).join('')}</div>`;
    }
  });
  if (S.casiers.length) h += `<button class="btn" data-act="newcas">＋ Ajouter un meuble ou une zone</button>`;
  const nonRangees = S.vins.filter(v => v.qte > 0 && (!getC(v.casierId) || (getC(v.casierId).rangees && (v.cases||[]).length < v.qte)));
  if (nonRangees.length) {
    h += `<h3>Bouteilles sans emplacement précis</h3><div class="mini">Touche une case vide d'un casier pour y placer une de ces bouteilles.</div>` + nonRangees.map(itemHTML).join('');
  }
  if (S.casiers.some(c => c.rangees)) h += `<p class="note">Bouteilles vues de face : la couleur = couleur du vin, le chiffre = millésime ('19 = 2019). Touche une bouteille pour la voir ou la boire, une place vide pour y ranger un vin.</p>`;
  return h + '</div>';
}

function vStats(){
  const vs = S.vins.filter(v => v.qte > 0);
  const tot = sum(vs.map(v => v.qte));
  const val = sum(vs.map(v => (+v.prix||0) * v.qte));
  const pret = vs.filter(v => (garde(v)||[])[0] === 'ok');
  const late = vs.filter(v => (garde(v)||[])[0] === 'late');
  const group = fn => { const m = {}; vs.forEach(v => { const k = fn(v); if (k) m[k] = (m[k]||0) + v.qte; }); return Object.entries(m); };
  const bars = (e, cf) => { const max = Math.max(1, ...e.map(x => x[1])); return e.map(([k,n]) => `<div class="bar"><span class="n">${esc(k)}</span><span class="b"><i style="width:${n/max*100}%;background:${cf(k)}"></i></span><span class="v">${n}</span></div>`).join(''); };
  const bues = S.historique.filter(x => new Date(x.date).getFullYear() === YEAR).length;
  let h = header('Statistiques') + `<div class="wrap">
    <div class="kpis"><div class="kpi"><b>${tot}</b><span>bouteilles</span></div><div class="kpi"><b>${val ? euro(val) : '—'}</b><span>valeur estimée</span></div><div class="kpi"><b>${bues}</b><span>bues en ${YEAR}</span></div></div>`;
  if (!tot) return h + '<div class="empty">Ajoute des bouteilles pour voir les statistiques.</div></div>';
  h += `<h3>Par couleur</h3><div class="card">${bars(group(v => v.couleur).sort((a,b)=>b[1]-a[1]).map(([k,n]) => [COUL[k]?.l||k, n]), l => (Object.values(COUL).find(c => c.l === l)||COUL.rouge).c)}</div>`;
  h += `<h3>Par région</h3><div class="card">${bars(group(v => v.region || 'Non renseignée').sort((a,b)=>b[1]-a[1]), () => 'var(--wine2)')}</div>`;
  const app = group(v => v.appellation).sort((a,b)=>b[1]-a[1]).slice(0,12);
  if (app.length) h += `<h3>Top appellations</h3><div class="card">${bars(app, () => '#b0566f')}</div>`;
  const mil = group(v => (String(v.millesime).match(/\d{4}/)||[])[0]).sort((a,b)=>b[0]-a[0]);
  if (mil.length) h += `<h3>Par millésime</h3><div class="card">${bars(mil, () => '#c99a2e')}</div>`;
  if (late.length) h += `<h3>⏳ À boire vite (${sum(late.map(v=>v.qte))})</h3>` + late.sort((a,b)=>a.boireJusqua-b.boireJusqua).map(itemHTML).join('');
  if (pret.length) h += `<h3>✅ Prêts à boire (${sum(pret.map(v=>v.qte))})</h3>` + pret.sort((a,b)=>(+a.boireJusqua||9999)-(+b.boireJusqua||9999)).map(itemHTML).join('');
  if (S.historique.length) {
    h += `<h3>Dernières bouteilles bues</h3><div class="card">` + S.historique.slice(-25).reverse().map(x =>
      `<div class="hist"><span class="dot" style="background:${(COUL[x.couleur]||COUL.rouge).c}"></span><span>${esc(x.libelle)}</span><small>${new Date(x.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'})}</small></div>`).join('') + '</div>';
  }
  return h + '</div>';
}

function casPreview(){
  const el = $('#c_prev'); if (!el || !CS) return;
  const r = Math.min(26, Math.max(1, parseInt($('#c_r').value) || 1)), co = Math.min(30, Math.max(1, parseInt($('#c_c').value) || 1));
  el.innerHTML = CS.style === 'libre' ? '' : `<label class="f">Aperçu · ${r * (CS.lignes * co - Math.floor(CS.lignes / 2))} places</label><div class="card" style="pointer-events:none">${drawCasier({id:'__apercu', rangees:r * CS.lignes, colonnes:co, lignes:CS.lignes, style:CS.style, sens:CS.sens}, {mini:0})}</div>`;
}
function saveCas(){
  const nom = $('#c_nom').value.trim(); if (!nom) { toast('Donne un nom au meuble'); return; }
  const style = CS.style, sens = CS.sens, L = style === 'libre' ? 1 : CS.lignes;
  let E = 0, co = 0;
  if (style !== 'libre') {
    E = Math.min(26, Math.max(1, parseInt($('#c_r').value) || 0));
    co = Math.min(30, Math.max(1, parseInt($('#c_c').value) || 0));
  }
  const data = {nom, rangees:E * L, colonnes:co, lignes:L, style, sens};
  if (CS.id) {
    const old = getC(CS.id), oL = nbL(old);
    const inside = S.vins.filter(v => v.casierId === CS.id);
    let lost = 0; const next = {};
    inside.forEach(v => {
      next[v.id] = (v.cases || []).map(k => {
        const [i, col] = k.split(',').map(Number), e = Math.floor(i / oL), lb = i % oL;
        if (e >= E || lb >= L || col >= co || (L > 1 && lb % 2 === 1 && col >= co - 1)) { lost++; return null; }
        return (e * L + lb) + ',' + col;
      }).filter(Boolean);
    });
    if (lost && !confirm(`${plural(lost,'bouteille')} ne rentre${lost>1?'nt':''} plus dans le nouveau format et ${lost>1?'seront marquées':'sera marquée'} « sans emplacement ». Continuer ?`)) return;
    inside.forEach(v => v.cases = next[v.id]);
    Object.assign(old, data);
  } else S.casiers.push({id:uid(), ...data});
  save(); closeSheet(); render(); toast('Meuble enregistré');
}

/* ---------- Actions ---------- */
function boire(id, k){
  const v = getV(id); if (!v || v.qte < 1) return;
  snap();
  v.cases = v.cases || [];
  if (k && v.cases.includes(k)) v.cases = v.cases.filter(x => x !== k);
  v.qte--;
  while (v.cases.length > v.qte) v.cases.pop();
  const lib = [v.domaine, v.cuvee, v.millesime].filter(Boolean).join(' ');
  S.historique.push({date:new Date().toISOString(), vinId:v.id, libelle:lib, couleur:v.couleur, region:v.region, millesime:v.millesime});
  save(); closeSheet(); render();
  toast(`Santé ! 🍷 ${v.qte ? 'Il en reste ' + v.qte : 'C\'était la dernière'}`, true);
}

function download(name, text, type){
  const blob = new Blob([text], {type});
  try {
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { navigator.share({files:[file], title:name}).catch(() => {}); return; }
  } catch(e){}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportCSV(){
  const cols = [['Domaine','domaine'],['Cuvée','cuvee'],['Couleur',v=>COUL[v.couleur]?.l],['Région','region'],['Appellation','appellation'],['Millésime','millesime'],['Quantité','qte'],['Casier',v=>getC(v.casierId)?.nom],['Emplacements',v=>{ const c = getC(v.casierId); return c && (v.cases||[]).length ? slotsText(c, v.cases) : ''; }],['Précision','emplacement'],['Prix',v=>v.prix===''?'':String(v.prix).replace('.',',')],['Boire de','boireDe'],["Boire jusqu'à",'boireJusqua'],['Note','note'],['Commentaire','commentaire']];
  const q = x => '"' + String(x ?? '').replace(/"/g, '""') + '"';
  const rows = [cols.map(c => q(c[0])).join(';')].concat(S.vins.map(v => cols.map(([,f]) => q(typeof f === 'function' ? f(v) : v[f])).join(';')));
  download(`cave-${new Date().toISOString().slice(0,10)}.csv`, '﻿' + rows.join('\r\n'), 'text/csv');
}

function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button data-act="undo">Annuler</button>' : '');
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), undo ? 5000 : 2200);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case 'tab': view = b.dataset.v; closeSheet(); render(); $('#app').scrollTop = 0; break;
    case 'close': closeSheet(); break;
    case 'new': openForm(null); break;
    case 'open': openDetail(id); break;
    case 'edit': openForm(id); break;
    case 'fcol': F.couleur = b.dataset.v; render(); break;
    case 'boire': boire(id, b.dataset.k); break;
    case 'plus1': { const v = getV(id); v.qte++; save(); render(); openDetail(id); toast('Bouteille ajoutée'); break; }
    case 'del': { const v = getV(id); if (confirm(`Supprimer « ${v.domaine} ${v.millesime||''} » de la cave ?`)) { snap(); S.vins = S.vins.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Supprimé', true); } break; }
    case 'undo': if (undoSnap) { S = JSON.parse(undoSnap); undoSnap = null; save(); render(); toast('Annulé'); } break;
    // formulaire vin
    case 'fc': FS.couleur = b.dataset.v; document.querySelectorAll('#f_coul button').forEach(x => x.classList.toggle('on', x === b)); renderFGrid(); break;
    case 'fn': { const n = +b.dataset.v; FS.note = FS.note === n ? 0 : n; document.querySelectorAll('#f_note button').forEach(x => x.classList.toggle('on', +x.dataset.v <= FS.note)); break; }
    case 'qm': { const i = $('#f_qte'); i.value = Math.max(0, (parseInt(i.value)||0) - 1); break; }
    case 'qp': { const i = $('#f_qte'); i.value = (parseInt(i.value)||0) + 1; break; }
    case 'fcell': { const k = b.dataset.k; FS.sel.has(k) ? FS.sel.delete(k) : FS.sel.add(k); const i = $('#f_qte'); if (FS.sel.size > (parseInt(i.value)||0)) i.value = FS.sel.size; renderFGrid(); break; }
    case 'fsave': saveForm(); break;
    // plan
    case 'cellocc': openDetail(id, b.dataset.k); break;
    case 'cellempty': {
      const c = getC(b.dataset.c), k = b.dataset.k;
      const cand = S.vins.filter(v => v.qte > (v.cases||[]).length && (v.casierId === c.id || !v.casierId)).sort((x,y) => cmp(x.domaine,y.domaine));
      openSheet(`<h2>${esc(c.nom)}</h2><div class="mini">${cellLabel(k, c).replace('Ét.', 'Étage ').replace(' n°', ', place n°')} — vide</div>
        <button class="btn p" data-act="newhere" data-c="${c.id}" data-k="${k}">＋ Ajouter un nouveau vin ici</button>
        ${cand.length ? `<h3>Ou y ranger une bouteille déjà en cave</h3>` + cand.map(v => `<div class="item" data-act="placer" data-id="${v.id}" data-c="${c.id}" data-k="${k}"><span class="dot" style="background:${colOf(v)}"></span><div class="main"><div class="t">${esc(v.domaine)}</div><div class="s">${esc([v.cuvee, v.appellation, v.millesime].filter(Boolean).join(' · '))}</div></div><span class="mini">${v.qte - (v.cases||[]).length} à placer</span></div>`).join('') : ''}`);
      break;
    }
    case 'newhere': openForm(null, {casierId:b.dataset.c, cell:b.dataset.k}); break;
    case 'placer': { const v = getV(id); v.casierId = b.dataset.c; v.cases = (v.cases||[]).concat(b.dataset.k); save(); closeSheet(); render(); toast(`Rangée : ${cellLabel(b.dataset.k, getC(b.dataset.c))}`); break; }
    case 'goto': { const el = document.getElementById('cas-' + id); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); break; }
    // casiers
    case 'newcas': openCas(null); break;
    case 'editcas': openCas(id); break;
    case 'cstyle': CS.style = b.dataset.v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('#c_dims').style.display = CS.style !== 'libre' ? '' : 'none'; casPreview(); break;
    case 'clig': CS.lignes = +b.dataset.v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); casPreview(); break;
    case 'csens': CS.sens = b.dataset.v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); casPreview(); break;
    case 'csave': saveCas(); break;
    case 'cdel': {
      const c = getC(id), n = sum(S.vins.filter(v => v.casierId === id).map(v => v.qte));
      if (confirm(`Supprimer « ${c.nom} » ?${n ? `\nLes ${n} bouteilles qu'il contient restent dans ta cave, sans emplacement.` : ''}`)) {
        snap(); S.vins.forEach(v => { if (v.casierId === id) { v.casierId = ''; v.cases = []; } });
        S.casiers = S.casiers.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Casier supprimé', true);
      }
      break;
    }
    // réglages
    case 'export': download(`cave-sauvegarde-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S, null, 1), 'application/json'); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#imp').click(); break;
    case 'wipe': if (confirm('Effacer toute la cave (vins, casiers, historique) ? Pense à exporter une sauvegarde avant.') && confirm('Vraiment tout effacer ?')) { S = {version:1,casiers:[],vins:[],historique:[]}; save(); render(); toast('Cave effacée'); } break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { F.q = e.target.value; renderList(); }
  else if (e.target.id === 'c_r' || e.target.id === 'c_c') casPreview();
  else if (e.target.id === 'f_app') autoRegion();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fr') { F.region = t.value; renderList(); }
  else if (t.id === 'ft') { F.tri = t.value; renderList(); }
  else if (t.id === 'fep') { F.epuises = t.checked; renderList(); }
  else if (t.id === 'f_reg') updAppList();
  else if (t.id === 'f_app') autoRegion();
  else if (t.id === 'f_cas') { FS.casierId = t.value; FS.sel.clear(); renderFGrid(); }
  else if (t.id === 'imp' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!Array.isArray(d.vins)) throw 0;
        if (confirm(`Restaurer cette sauvegarde (${d.vins.length} références) ? Elle remplacera la cave actuelle.`)) {
          S = Object.assign({version:1,casiers:[],vins:[],historique:[]}, d); save(); render(); toast('Sauvegarde restaurée ✓');
        }
      } catch(err) { toast('Fichier de sauvegarde invalide'); }
      t.value = '';
    };
    rd.readAsText(t.files[0]);
  }
});

render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', () => { if (!window.__swReload) { window.__swReload = 1; location.reload(); } });
</script>
</body>
</html>
